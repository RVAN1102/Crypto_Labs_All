# Lab 4 Nginx TLS example.
# Replace placeholders only for a local server or owned domain.

server {
    listen 443 ssl http2;
    server_name lab4.example.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/ecdsa_private_key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;

    location / {
        return 200 "Lab 4 TLS local/owned-domain test\n";
    }
}

