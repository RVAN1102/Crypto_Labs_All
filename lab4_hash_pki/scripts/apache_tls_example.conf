# Lab 4 Apache TLS example.
# Replace placeholders only for a local server or owned domain.

<VirtualHost *:443>
    ServerName lab4.example.com

    SSLEngine on
    SSLCertificateFile /path/to/fullchain.pem
    SSLCertificateKeyFile /path/to/ecdsa_private_key.pem

    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256
    SSLHonorCipherOrder off
    SSLCompression off

    Header always set X-Content-Type-Options nosniff

    DocumentRoot /var/www/lab4
</VirtualHost>

