# Lab 4 TLS config reference snippets.
# Replace placeholder paths and lab4.example.com only for a local server or owned domain.
# Do not claim trusted-root TLS unless using a real CA-issued certificate for an owned domain.

### Nginx example
server {
    listen 443 ssl http2;
    server_name lab4.example.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/ecdsa_private_key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers off;

    location / {
        return 200 "Lab 4 TLS local/owned-domain test\n";
    }
}

### Apache example
<VirtualHost *:443>
    ServerName lab4.example.com

    SSLEngine on
    SSLCertificateFile /path/to/fullchain.pem
    SSLCertificateKeyFile /path/to/ecdsa_private_key.pem

    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256
    SSLHonorCipherOrder off

    DocumentRoot /var/www/lab4
</VirtualHost>

