
<VirtualHost *:443>
    ServerName bavan.infinityfreeapp.com
    DocumentRoot "D:/Apache24/htdocs/lab4-public-trust"

    SSLEngine on
    SSLCertificateFile "D:/Apache24/conf/ssl/lab4_bavan_fullchain.pem"
    SSLCertificateKeyFile "[REDACTED_PRIVATE_KEY_PATH]"

    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5

    ErrorLog "logs/lab4-public-trust-error.log"
    CustomLog "logs/lab4-public-trust-access.log" common

    <Directory "D:/Apache24/htdocs/lab4-public-trust">
        Require all granted
    </Directory>
</VirtualHost>
