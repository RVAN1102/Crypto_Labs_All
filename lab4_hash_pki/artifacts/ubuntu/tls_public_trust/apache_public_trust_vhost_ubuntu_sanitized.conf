<VirtualHost *:443>
    ServerName bavan.infinityfreeapp.com
    DocumentRoot /var/www/lab4-public-trust

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/lab4-public-trust/lab4_bavan_fullchain.pem
    SSLCertificateKeyFile [REDACTED_PRIVATE_KEY_PATH]

    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5

    ErrorLog ${APACHE_LOG_DIR}/lab4-public-trust-error.log
    CustomLog ${APACHE_LOG_DIR}/lab4-public-trust-access.log combined

    <Directory /var/www/lab4-public-trust>
        Require all granted
    </Directory>
</VirtualHost>
